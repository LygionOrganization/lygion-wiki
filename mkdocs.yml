site_name: Lygion Wiki
site_description: Product documentation, tutorials, reference guides, and open-source resources for Lygion Robotics.
site_url: https://wiki.lygion.ai/

exclude_docs: |
  reference/bus-devices/robot-driver-with-esp32s3-lite/PDF文档（251018）/*
  reference/bus-devices/ttl-node-a/TTL_Node_(A)_使用文档.pdf
  reference/robots/linkarm-lt/文档/*

repo_name: LygionOrganization/lygion-wiki
repo_url: https://github.com/LygionOrganization/lygion-wiki
edit_uri: blob/main/docs/

theme:
  name: material
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          nav:
            - 首页: index.md
            - 快速开始:
                - quickstart/index.md
                - 快速上手（Python）: quickstart/python-first-demo.md
