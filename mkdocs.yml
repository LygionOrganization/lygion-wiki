site_name: Lygion Wiki
site_description: Product documentation, tutorials, reference guides, and open-source resources for Lygion Robotics.
site_url: https://wiki.lygion.ai/

repo_name: LygionRobotics/lygion-wiki
repo_url: https://github.com/LygionRobotics/lygion-wiki
edit_uri: blob/main/docs/

theme:
  name: material
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          nav:
            - 首页: index.md
            - 快速开始:
                - quickstart/index.md
                - 快速上手（Python）: quickstart/python-first-demo.md
                - 快速上手（C++ / Arduino）: quickstart/cpp-first-demo.md
            - 基础教程:
                - tutorials/index.md
                - 电脑和开发板（Python）:
                    - 安装 USB 串口驱动: tutorials/install-usb-serial-driver.md
                    - 如何打开终端 / CMD / PowerShell: tutorials/open-terminal.md
                    - 安装 Python: tutorials/install-python.md
                    - 查找串口设备: tutorials/find-serial-port.md
                    - 运行 Python 脚本: tutorials/run-python-scripts.md
                - 嵌入式设备（C++）:
                    - 安装 Arduino IDE: tutorials/install-arduino-ide.md
                    - 安装 PlatformIO: tutorials/install-platformio.md
                    - MCU UART 接线基础: tutorials/mcu-uart-wiring.md
                    - 上传 Arduino 示例程序: tutorials/upload-arduino-sketch.md
                    - 打开串口监视器: tutorials/serial-monitor.md
                - 总线设备基础:
                    - 设备 ID 与波特率: tutorials/device-id-and-baudrate.md
                    - 供电与接线基础: tutorials/power-and-wiring-basics.md
                    - 分组供电和供电解耦: tutorials/power-grouping-and-decoupling.md
                    - 常见通信问题排查: tutorials/communication-troubleshooting.md
                    - FD 调试软件: tutorials/fd-tool.md
            - 产品 Wiki:
                - reference/index.md
                - 总线设备:
                    - reference/bus-devices/index.md
                    - TTL Adapter (A):
                        - reference/bus-devices/ttl-adapter-a/index.md
                        - 硬件概览: reference/bus-devices/ttl-adapter-a/hardware-overview.md
                        - 供电与接线: reference/bus-devices/ttl-adapter-a/power-and-wiring.md
                        - 驱动与串口: reference/bus-devices/ttl-adapter-a/drivers-and-ports.md
                        - SDK 与工具: reference/bus-devices/ttl-adapter-a/sdk-and-tools.md
                    - TTL Encoder E02:
                        - reference/bus-devices/ttl-encoder-e02/index.md
                        - 硬件安装: reference/bus-devices/ttl-encoder-e02/hardware-installation.md
                        - Python 读取: reference/bus-devices/ttl-encoder-e02/python-quickstart.md
                        - C++ / Arduino: reference/bus-devices/ttl-encoder-e02/cpp-arduino.md
                        - 校准与多圈: reference/bus-devices/ttl-encoder-e02/calibration-and-multiturn.md
                        - FAQ: reference/bus-devices/ttl-encoder-e02/faq.md
                    - TTL Stepper Driver (A):
                        - reference/bus-devices/ttl-stepper-driver-a/index.md
                        - 硬件接线: reference/bus-devices/ttl-stepper-driver-a/hardware-wiring.md
                        - 运行模式: reference/bus-devices/ttl-stepper-driver-a/operating-modes.md
                        - 参数说明: reference/bus-devices/ttl-stepper-driver-a/parameters.md
                        - Python 控制: reference/bus-devices/ttl-stepper-driver-a/python-quickstart.md
                        - C++ / Arduino: reference/bus-devices/ttl-stepper-driver-a/cpp-arduino.md
                        - 限位、回零与心跳保护: reference/bus-devices/ttl-stepper-driver-a/limits-homing-heartbeat.md
                        - FAQ: reference/bus-devices/ttl-stepper-driver-a/faq.md
                    - Robot Driver with ESP32S3 Lite:
                        - reference/bus-devices/robot-driver-with-esp32s3-lite/index.md
                        - 板载资源介绍: reference/bus-devices/robot-driver-with-esp32s3-lite/board-resources.md
                        - 初次使用教程: reference/bus-devices/robot-driver-with-esp32s3-lite/quickstart.md
                        - 动作脚本编排: reference/bus-devices/robot-driver-with-esp32s3-lite/action-scripting.md
                        - JSON 指令交互: reference/bus-devices/robot-driver-with-esp32s3-lite/json-command-interaction.md
                        - USB CDC 有线通信: reference/bus-devices/robot-driver-with-esp32s3-lite/usb-cdc-wired-communication.md
                        - HTTP 无线通信: reference/bus-devices/robot-driver-with-esp32s3-lite/http-wireless-communication.md
                        - Websocket 无线通信: reference/bus-devices/robot-driver-with-esp32s3-lite/websocket-wireless-communication.md
                        - 刷机重置: reference/bus-devices/robot-driver-with-esp32s3-lite/firmware-flash-and-reset.md
                        - 二次开发指南: reference/bus-devices/robot-driver-with-esp32s3-lite/advanced-development.md
                        - S.BUS 二次开发: reference/bus-devices/robot-driver-with-esp32s3-lite/sbus-development.md
                        - FAQ: reference/bus-devices/robot-driver-with-esp32s3-lite/faq.md
            - 下载中心: downloads/index.md
        - locale: en
          name: English
          build: true
          nav:
            - Home: index.md
            - Quick Start: quickstart/index.md
            - Tutorials: tutorials/index.md
            - Reference: reference/index.md
            - Downloads: downloads/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      url_download: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css
